server {
    listen 80 ssl default_server;
    listen [::]:80 ssl default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # Auto-redirect HTTP to HTTPS if plain HTTP is sent to SSL port
    error_page 497 https://$http_host$request_uri;

    # Relative redirects preserve protocol (HTTPS) and domain through Cloudflare and reverse proxies
    absolute_redirect off;
    port_in_redirect off;

    # Sovereign Self-Signed / Custom Enterprise TLS Certificates
    ssl_certificate /etc/nginx/ssl/monitorix.crt;
    ssl_certificate_key /etc/nginx/ssl/monitorix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Master Enterprise Documentation Portal
    location = /docs {
        return 301 /docs/;
    }

    # Route raw Markdown files to Documentation Viewer instead of downloading
    location ~* ^/docs/(.+\.md)$ {
        root /usr/share/nginx/html;
        types { text/markdown md; }

        if ($arg_raw = "1") {
            add_header Content-Type "text/markdown; charset=utf-8";
            add_header Cache-Control "no-cache";
            break;
        }

        if ($arg_download = "1") {
            add_header Content-Disposition "attachment; filename=$1";
            add_header Content-Type "application/octet-stream";
            break;
        }

        return 302 /docs/viewer.html?doc=$1;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # FastAPI Swagger UI and OpenAPI Schema Proxies
    location = /api/docs {
        proxy_pass http://watch-sec-backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://watch-sec-backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://watch-sec-backend:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy API requests to backend service
    location /api/ {
        proxy_pass http://watch-sec-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Reverse Proxy Socket.IO WebSockets to backend service
    location /socket.io/ {
        proxy_pass http://watch-sec-backend:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
